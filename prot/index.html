<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- v2.0.8：自造字体 2.1MB 是首屏最大单笔，预加载以免正文先以后备字形渲染再跳变
     （正文全是自造字形，FOUT 跳变最刺眼）。 -->
<link rel="preload" href="assets/fonts/qijifallback.woff2" as="font" type="font/woff2" crossorigin>
<!-- v2.0.7 移除 maximum-scale=1.0 / user-scalable=no（违反 WCAG 1.4.4）：
     本作正文是自造字体的长篇叙事，目标用户含中老年与低龄玩家，最需要放大阅读。
     iOS Safari 会忽略 user-scalable，故此前该限制在 iOS 上本就失效——两边都不该禁。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>青史志</title>
<style>
  /* 黄令东齐伋体（原字体 38.8MB / 20971 字，仅含 CJK 统一表意字，无拉丁与标点）。
     已按项目实际用字子集化为 2838 字（woff2 2.1MB / ttf 4.3MB），见 tools/subset-font.py。
     数字与标点该字体没有，由后面的后备字体接管。
     font-weight 声明为 100 900：原字体只有 Regular 一个字重，
     这样浏览器不会对粗体做「伪加粗」糊边。 */
  @font-face{
    font-family:"QIJIFALLBACK";
    /* v2.0.8：去掉 ttf 源。现代浏览器一律只取 woff2（2.1MB），
       ttf（4.5MB）从未被下载过，只是让旧浏览器多一次 200；此处一并从 src 移除，
       仓库里的 .ttf 文件可另作归档（.gitignore 已排除 raw 类产物，字体仍在版本库中）。 */
    src:url("assets/fonts/qijifallback.woff2") format("woff2");
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  :root{
    --bg:#17140f; --panel:#221d15; --panel2:#2a241a; --ink:#e8dfc8; --ink-dim:#a89a7c;
    --zhu:#b0432f; --gold:#c9a959; --qing:#7fa8a0; --orange:#c97a3a;
    /* v2.0.7 高对比朱（--zhu-hi）：--zhu 在深底 #17140f/#2a241a 上仅 2.94:1，未达 WCAG AA，
       而它承载的恰是危机标识、锁定原因、负向变化、顶栏最高危段位——危险度最高时
       对比度最差。正文小字（11–13px）尤其不可读，故另立一档亮朱给信息位用，
       保留 --zhu 给边框/徽标等非文字装饰。 */
    --zhu-hi:#e8705a;
    --dev:#c97a3a;   /* 偏离度专属赭金（GDD 6.1/6.3），区别于功业/成就用的 --gold */
    --line:#3a3226;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* v2.0.7：100dvh 改用 100svh。dvh 随地址栏收放而改变，整壳高度随之变化会触发全页重排；
     svh（小视口高度）为稳定值，视觉上仍占满一屏。 */
  html,body{height:100%; height:100svh}
  body{
    background:#0d0b08; color:var(--ink);
    font-family:"QIJIFALLBACK","Noto Serif SC","Songti SC","STSong","SimSun",serif;
    display:flex; justify-content:center; overflow:hidden;
  }
  #app{width:100%; max-width:480px; height:100%; height:100svh; background:var(--bg); position:relative;
    display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,.8);}

  /* 顶部状态栏 */
  /* v2.0.7：顶栏此前无安全区内边距，刘海屏上会压到状态栏 */
  #topbar{padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 8px; border-bottom:1px solid var(--line);
    background:var(--panel); flex:none}
  #topbar .row{display:flex; align-items:center; justify-content:space-between; gap:8px}
  #chapTitle{font-size:13px; color:var(--ink-dim); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #menuBtns{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
  /* 小屏（360–420px）：顶栏允许换行，按钮收紧，章节名整行 */
  @media (max-width:420px){
    #topbar{padding:8px 10px 6px}
    #topbar .row{flex-wrap:wrap; gap:6px}
    #chapTitle{max-width:100%; font-size:12px}
    .iconbtn{font-size:11px; padding:6px 8px}   /* v2.0.7：小屏亦保 28px 触区 */
  }
  /* v2.0.7：顶栏按钮触区原约 22px（3px 纵向 padding + 12px 字），低于 WCAG 2.2 SC 2.5.8
     的 24×24 最小目标尺寸；小屏下更降到约 21px。提到 28px 触区，字号不变以维持排版。 */
  .iconbtn{background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:12px;
    padding:6px 10px; min-height:28px; min-width:28px; border-radius:3px; cursor:pointer; font-family:inherit}
  .iconbtn:active{background:var(--panel2)}
  .iconbtn:disabled{opacity:.3; cursor:default}
  /* 全站键盘焦点可见（v2.0.7 可访问性）：此前只有 :active，键盘用户完全无焦点指示
     （WCAG 2.4.7 失败）。统一用 :focus-visible，不打扰鼠标点击。 */
  button:focus-visible, a:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  button:disabled{cursor:not-allowed}
  #devWrap{margin-top:8px; display:flex; align-items:center; gap:8px}
  #devLabel{font-size:11px; color:var(--dev); white-space:nowrap; font-weight:normal; letter-spacing:1px}
  #devBar{flex:1; height:5px; background:#0d0b08; border-radius:3px; overflow:hidden; position:relative}
  #devFill{height:100%; width:0%; background:var(--qing); transition:width .6s, background .6s}
  #devBand{font-size:11px; white-space:nowrap; min-width:32px; text-align:right}

  /* 主区域 */
  #main{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:26px 22px 20px; scrollbar-width:thin}
  #main::-webkit-scrollbar{width:4px}
  #main::-webkit-scrollbar-thumb{background:var(--line)}

  /* 主页 */
  /* v2.0.8 移除死样式：.homeTitle / .homeQuote / .diffCard* 全站零引用
     （难度选择早已改用 .diffBtn 按钮组，主页标题改用 .homeTitleImg 图片），
     只有 .diffCard 因子串被 .diffCard .dn 的字距补偿规则匹配到。留着会误导
     「难度卡长这样」——真去改这里改不到任何东西。 */
  .homeSub{text-align:center; color:var(--ink-dim); font-size:14px; letter-spacing:3px; margin-bottom:8px}
  .bigBtn{display:block; width:100%; margin-top:26px; padding:15px 0; text-align:center;
    background:var(--zhu); color:#f4e9dc; border:none; border-radius:4px; font-size:17px; letter-spacing:8px;
    cursor:pointer; font-family:inherit}
  .bigBtn:active{filter:brightness(1.15)}
  .ghostBtn{display:block; width:100%; margin-top:12px; padding:12px 0; text-align:center; background:none;
    color:var(--ink-dim); border:1px solid var(--line); border-radius:4px; font-size:14px; letter-spacing:4px; cursor:pointer; font-family:inherit}

  /* 章首 */
  .chapKicker{font-size:12px; color:var(--zhu-hi); letter-spacing:3px; margin-bottom:10px}   /* v2.0.7 高对比朱 */
  .chapHead{font-size:24px; letter-spacing:3px; margin-bottom:22px}
  .chapHead::after{content:''; display:block; height:10px; margin-top:10px; background:url('assets/orn/orn_yunlei.png') left center/64px 8px repeat-x; opacity:.45}
  .scoreHead::after{content:''; display:block; height:10px; margin-top:6px; background:url('assets/orn/orn_yunlei.png') left center/64px 8px repeat-x; opacity:.4}
  .seg{font-size:16px; line-height:2.15; margin-bottom:18px; text-align:justify; animation:segIn .5s ease both}
  @keyframes segIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .noteSeg{font-size:13px; line-height:1.9; color:var(--gold); border-left:2px solid var(--gold); padding-left:12px; margin-bottom:18px; animation:segIn .5s ease both}

  /* 事件 */
  .evKicker{font-size:12px; color:var(--ink-dim); letter-spacing:2px; margin-bottom:14px}
  .evTitle{font-size:21px; letter-spacing:2px; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--line)}

  /* 回合页（行动卡回合制主界面） */
  .roundGuide{font-size:14px; color:var(--ink-dim); line-height:2; margin-bottom:16px}
  .settleEcho{font-size:14px; line-height:2; color:var(--ink); border-left:2px solid var(--qing); padding-left:12px; margin-bottom:18px; animation:segIn .5s ease both}
  .card{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink); padding:12px 14px; margin:8px 0; border-radius:3px; cursor:pointer;
    font-family:inherit; position:relative; transition:border-color .15s}
  .card:active{border-color:var(--gold)}
  .card.key{border-color:var(--gold); background:#2e2718}
  .card.key.passive{cursor:default; opacity:.82}
  .card.key.passive:active{border-color:var(--gold)}
  .card.key.enterable{cursor:pointer; border-style:dashed}
  .card.key.enterable .cardLock{color:var(--ink-dim)}
  .card.key.crisis{border-color:var(--zhu); background:#2b1a14}
  .card.locked{opacity:.45; cursor:not-allowed}
  /* v2.0.4：引擎 null 兜底提示（此前 disableOpts 后静默 return，按钮永不再可用） */
  .optStuck{font-size:12px; color:var(--gold); line-height:1.7; border:1px dashed var(--gold);
    padding:8px 12px; margin:8px 0; animation:segIn .5s ease both}
  .cardKicker{font-size:11px; color:var(--gold); letter-spacing:2px; margin-bottom:5px}
  .card.key.crisis .cardKicker{color:var(--zhu-hi)}   /* v2.0.7：危机卡 kicker 提对比 */
  .cardTitle{font-size:15px; line-height:1.5}
  .cardDesc{font-size:12px; color:var(--ink-dim); margin-top:4px; line-height:1.7}
  .cardBadge{position:absolute; right:10px; top:10px; color:var(--gold); border:1px solid var(--gold);
    border-radius:2px; font-size:11px; padding:1px 5px; opacity:.8}
  .card.key.crisis .cardBadge{color:var(--zhu); border-color:var(--zhu)}
  .cardDim{font-size:11px; color:var(--orange); margin-top:5px}
  .cardLock{font-size:12px; color:var(--zhu-hi); margin-top:5px}   /* v2.0.7：11px 亮朱 → 12px 高对比朱 */

  /* v2.0.7 居中文字的字距补偿：letter-spacing 在末字之后也留一份空白，
     故居中排版整体左偏一个字距。仓库里只有 .goBtn 做了 text-indent 补偿，
     其余居中元素肉眼可见偏左。此处按各自的字距统一补齐。 */
  .bigBtn, #settleContinue{text-indent:8px}
  .ghostBtn{text-indent:4px}
  .contBtn{text-indent:6px}
  .diffBtn, .homeDivider, #drawerBody h3, #glossCard .gt, .attrGroup{text-indent:4px}
  .homeSub, .chapKicker{text-indent:3px}
  #glossCard .gbtn, #shareCard .sbtn, .scenCard .dynName{text-indent:6px}

  /* 底部选项区 */
  /* v2.0.7 安全区与滚动链：#options 是唯一常驻的底部操作区（回合/事件/章末全靠它），
     此前只有 #settleCard 覆盖了 safe-area-inset-bottom —— 刘海屏机型上选项按钮压到
     Home Indicator。两个嵌套滚动容器补 overscroll-behavior:contain，阻断滚动链。 */
  #options{flex:none; max-height:42vh; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin;
    padding:12px 16px calc(18px + env(safe-area-inset-bottom, 0px)); border-top:1px solid var(--line); background:var(--panel)}
  .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink); padding:13px 15px; margin:8px 0; border-radius:3px; font-size:15px; line-height:1.6;
    cursor:pointer; font-family:inherit; position:relative; transition:border-color .15s}
  .opt:active{border-color:var(--gold)}
  .opt .histmark{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--ink-dim); opacity:.45; font-size:12px; border:1px solid var(--line); border-radius:2px; padding:1px 5px}
  .opt.locked{opacity:.42; cursor:not-allowed}
  /* 锁定原因与负向变化改用高对比朱（v2.0.4 可访问性：原 --zhu 在深底上仅 2.94:1，
   * 而这恰是危机/锁定/负向等最需要看清的信息位） */
  .opt .lockreason{display:block; font-size:12px; color:var(--zhu-hi); margin-top:4px}
  .opt.risky{border-color:var(--orange); background:#2b2114}
  .opt .riskline{display:block; font-size:11px; color:var(--orange); margin-top:4px}
  .optTeach{font-size:12px; color:var(--gold); line-height:1.8; border:1px dashed var(--gold); padding:8px 12px; margin:8px 0; animation:segIn .5s ease both}
  .card.risky{border-color:var(--orange); background:#2b2114}
  .card .riskline{display:block; font-size:11px; color:var(--orange); margin-top:4px}
  .card.xushi{border-style:dashed; border-color:var(--qing); background:#1c211f}
  .card.xushi.active{opacity:.55; cursor:default}
  .contBtn{display:block; width:100%; padding:13px 0; background:none; border:1px dashed var(--line);
    color:var(--ink-dim); border-radius:3px; font-size:14px; letter-spacing:6px; cursor:pointer; font-family:inherit; animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* 结算浮层 */
  #overlay{position:absolute; inset:0; background:rgba(10,8,5,.82); display:flex; align-items:flex-end; z-index:20}
  #settleCard{width:100%; max-height:86vh; overflow-y:auto; scrollbar-width:thin; background:var(--panel); border-top:2px solid var(--gold); padding:22px 22px calc(20px + env(safe-area-inset-bottom, 0px)); animation:up .35s ease both}
  @keyframes up{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
  #settleText{font-size:15px; line-height:2.05; text-align:justify; margin-bottom:16px}
  .chg{font-size:14px; margin:5px 0; animation:segIn .3s ease both}
  .chg .plus{color:#9dc48a}.chg .minus{color:var(--zhu-hi)}   /* v2.0.7：正/负向变化改高对比（#8fae7c 原 4.9:1） */
  .chg .dev{color:var(--dev)}
  .chg .note{color:var(--ink-dim); font-size:12px; margin-left:8px}
  #achPop{font-size:13px; color:var(--gold); border:1px dashed var(--gold); padding:6px 10px; margin-top:10px; display:inline-block}
  #bandWarn{margin-top:10px; font-size:13px; color:var(--orange)}

  /* 属性面板抽屉 */
  #drawer{position:absolute; inset:0; z-index:30; display:none}
  #drawer.open{display:block}
  #drawerMask{position:absolute; inset:0; background:rgba(10,8,5,.6)}
  #drawerBody{position:absolute; right:0; top:0; bottom:0; width:78%; max-width:330px; background:var(--panel);
    border-left:1px solid var(--line); padding:24px 20px; overflow-y:auto}
  #drawerBody h3{font-size:15px; letter-spacing:4px; color:var(--ink-dim); margin-bottom:18px; font-weight:normal}
  .attrRow{margin-bottom:15px}
  .attrRow .lab{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px}
  .attrRow .lab .val{color:var(--ink-dim)}
  .attrBar{height:4px; background:#0d0b08; border-radius:2px; overflow:hidden}
  .attrBar i{display:block; height:100%; background:var(--qing)}
  .attrBar.inv i{background:var(--zhu)}
  #drawerMeta{margin-top:20px; font-size:12px; color:var(--ink-dim); line-height:2; border-top:1px solid var(--line); padding-top:14px}
  #achList span{display:inline-block; border:1px solid var(--gold); color:var(--gold); font-size:11px; padding:2px 8px; margin:3px 4px 0 0; border-radius:2px}

  /* 结局页 */
  .endSeal{display:inline-block; border:1px solid var(--zhu); color:var(--zhu); font-size:12px; letter-spacing:3px; padding:3px 10px; margin-bottom:14px}
  .endName{font-size:34px; letter-spacing:8px; margin-bottom:20px}
  .endZhuan{font-size:15px; line-height:2.3; text-align:justify; color:var(--ink); background:var(--panel);
    border-left:3px solid var(--gold); padding:18px 18px; margin-bottom:24px}
  .scoreHead{font-size:13px; letter-spacing:4px; color:var(--ink-dim); margin:22px 0 12px}
  #radarWrap{display:flex; justify-content:center; margin:6px 0 14px}
  .scoreLine{display:flex; justify-content:space-between; font-size:13px; padding:6px 2px; border-bottom:1px dashed var(--line)}
  .scoreLine b{color:var(--gold); font-weight:normal}
  #totalLine{display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; padding-top:12px; border-top:1px solid var(--line)}
  #totalScore{font-size:30px; color:var(--gold)}
  #gradeBadge{font-size:30px; color:var(--zhu); border:2px solid var(--zhu); width:58px; height:58px; display:flex; align-items:center; justify-content:center; border-radius:50%}
  /* 主页（v1.6.9 朝代页水墨风）：水墨山水底 + 青史志书法 + 卷轴式朝代选择 */
  .homeTitleImg{display:flex; justify-content:center; margin:44px 0 4px}
  #app.home-hero.home-ink::before{background-image:url('assets/ui/bg_ink.jpg'); background-position:center bottom}
  /* v2.1.5 改名：书法标题回退为文字标题。
   * 原因——旧图 assets/ui/title.png 是位图，内含「青史生存录」五字，改名后无法文本替换；
   * 现成的新名图 assets/ui/title_zhi.png / title_zhi_v.png 均为**暗色试作稿**（几乎全黑，
   * 压在深色背景上看不清；_v 另为竖排，与现有横排版式不符），故一律不采用。
   * 回退到程序渲染文字，待合格图（横排·墨金·可读）交付后改回 .homeTitleImg img 一行即可。
   * 交付要求已登记在《青史志》美术资产清单（待交付项 A-0）。 */
  .homeTitleTxt{text-align:center; margin:44px 0 4px; font-size:40px; letter-spacing:14px;
    text-indent:14px; color:var(--gold); font-weight:600}
  .homeTitleTxt.zhi{margin-top:7vh; font-size:34px}
  #app.home-hero.home-ink .homeTitleTxt{color:#3a342c}
  .homeSub.ink{color:#3a342c}
  .homeSub.ink.soon{margin-top:14px; text-align:center}
  #app.home-hero.home-ink .homeDivider{color:#6b6459}

  /* 卷面：刻度带可拖，与朱印同步横移；溢出隐藏 → 两侧露角即相邻朝代 */
  .dynStrip{
    position:relative; margin:6vh 0 0; height:115px; overflow:hidden;
    cursor:grab; touch-action:pan-y; -webkit-user-select:none; user-select:none;
  }
  .dynStrip:active{cursor:grabbing}
  /* 刻度带：left 需回退半个刻度宽(52px)，否则第 0 格的「中心」落在屏心右侧 52px，
     与居中的 .dynSealTrack 错开半格 —— 吸附定位就会偏。 */
  .dynTrack{
    position:absolute; left:calc(50% - 52px); top:0; height:115px;
    display:flex; align-items:center; will-change:transform;
  }
  .dynTick{
    flex:none; width:104px; height:115px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; letter-spacing:10px; text-indent:10px;
    color:#a49a88; opacity:.5;                 /* 未开放：淡墨 */
    transition:opacity .3s, color .3s;
  }
  .dynTick.open{ color:#6b6459; opacity:.85; }
  /* 当前刻度被朱印盖住：隐藏其字，避免与印内文字重影 */
  .dynTick.cur{ opacity:0; }

  /* 朱印：红框图 221×244（≈正方 ratio .906）。object-fit:contain 保证笔触绝不变形。
     这条轨道黏在当前朝代的刻度上：静止时偏移 0（居中），滑动时随朝代一起走。 */
  .dynSealTrack{
    position:absolute; left:0; right:0; top:0; height:115px;
    display:flex; justify-content:center; pointer-events:none; will-change:transform;
  }
  .dynSeal{
    position:relative; width:104px; height:115px; pointer-events:auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .dynSeal img{ position:absolute; inset:0; width:104px; height:115px; object-fit:contain; }
  .dynSeal span{ position:relative; font-size:26px; font-weight:700; letter-spacing:10px; text-indent:10px; color:#7a2b1d; }
  /* 未开放：红框转灰但保留可见轮廓（不可见会让人以为指针丢了），字转为可读的淡墨 */
  .dynSeal.locked{ cursor:pointer; }
  .dynSeal.locked img{ opacity:.45; filter:grayscale(1); }
