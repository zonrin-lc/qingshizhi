<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover:允许内容延伸到刘海/圆角区域,
      真正的安全区由 CSS 的 env(safe-area-inset-*) 负责内缩。
      user-scalable=no:移动端双击缩放会打乱横屏棋盘布局。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2ead8" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="《青史志》—— 历史剧本偏离模拟器" />
    <title>青史志</title>
  </head>
  <body>
    <!-- 布局壳由 src/main.ts 挂载;此处只留承载节点 -->
    <div id="app"></div>
    <noscript>《青史志》需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
